name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 的官方构建覆盖 Ubuntu 24.04，不覆盖 ubuntu-latest 的 26.04。
        os: [ubuntu-24.04, macos-latest, windows-latest]
        # 日常覆盖三系统最低版本和一个新版；手动运行完整九组合。
        python: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["3.9", "3.12", "3.13"]' || '["3.9"]') }}
        include:
          - os: ubuntu-24.04
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      # LICENSE 的官方文本哈希与源码清单按原始字节校验。
      - name: 保留仓库原始换行
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: 全量单测
        run: python -m unittest discover -s tests
      - name: 临时目录构建
        run: python scripts/build.py --out "${{ runner.temp }}/dist"
